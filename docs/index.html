<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dutch Virology Network v2.0 — Multiplex Knowledge Graph</title>
<script src="https://unpkg.com/force-graph@1.44"></script>
<style>
:root {
  --bg-primary: #0f0f23;
  --glass-bg: rgba(22, 33, 62, 0.75);
  --glass-border: rgba(255, 255, 255, 0.08);
  --accent: #e94560;
  --accent-glow: rgba(233, 69, 96, 0.3);
  --text: #e0e0f0;
  --text-dim: #6a6a95;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg-primary); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif; }
#loading {
  position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg-primary); z-index:9999; transition:opacity 0.5s;
}
#loading.hidden { opacity:0; pointer-events:none; }
.spinner {
  width:48px; height:48px; border:3px solid var(--text-dim); border-top-color:var(--accent);
  border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:16px;
}
@keyframes spin { to { transform:rotate(360deg); } }
#loading p { font-size:14px; color:var(--text-dim); }
#graph-container { position:fixed; inset:0; z-index:1; }

/* ── Sidebar ───────────────────────────────── */
#sidebar {
  position:fixed; top:16px; left:16px; width:360px; max-height:calc(100vh - 32px);
  background:var(--glass-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border); border-radius:16px; box-shadow:var(--shadow);
  z-index:10; display:flex; flex-direction:column; overflow:hidden;
  transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
#sidebar.collapsed { transform:translateX(-380px); }
#toggle-sidebar {
  position:fixed; top:20px; left:20px; z-index:11;
  width:36px; height:36px; border:none; border-radius:10px;
  background:var(--glass-bg); backdrop-filter:blur(12px); color:var(--text);
  font-size:18px; cursor:pointer; display:none; align-items:center; justify-content:center;
  border:1px solid var(--glass-border);
}

/* ── Search ───────────────────── */
#search-section { padding:14px 16px 10px; flex-shrink:0; }
#search-input {
  width:100%; padding:10px 14px; border:1px solid var(--glass-border); border-radius:12px;
  background:rgba(255,255,255,0.04); color:var(--text); font-size:13px; outline:none;
  transition:border-color 0.2s;
}
#search-input:focus { border-color:var(--accent); }
#search-input::placeholder { color:var(--text-dim); }
#search-results {
  max-height:180px; overflow-y:auto; display:none; margin-top:4px;
  background:rgba(13,27,62,0.95); backdrop-filter:blur(12px);
  border:1px solid var(--glass-border); border-radius:10px;
}
.sr-item { padding:7px 12px; cursor:pointer; font-size:12px; color:var(--text); transition:background 0.15s; }
.sr-item:hover { background:rgba(233,69,96,0.15); }
.sr-item .sr-meta { float:right; color:var(--text-dim); font-size:10px; }

/* ── Controls ─────────────────── */
#controls { padding:0 16px 8px; display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0; }
.layer-btn {
  padding:4px 12px; border:1px solid var(--glass-border); border-radius:20px;
  background:transparent; color:var(--text-dim); font-size:11px; cursor:pointer;
  transition:all 0.2s; font-weight:500;
}
.layer-btn:hover { border-color:var(--accent); color:var(--text); }
.layer-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
#stats { padding:0 16px 10px; font-size:10px; color:var(--text-dim); display:flex; gap:12px; flex-shrink:0; }

/* ── Timeline slider hidden by default (too complex for this iteration) ─ */

/* ── Inspect panel ────────────── */
#inspect { padding:0 16px 16px; overflow-y:auto; flex:1; min-height:0; font-size:13px; }
#inspect h2 { font-size:17px; color:var(--accent); margin-bottom:2px; }
#inspect .meta { color:var(--text-dim); font-size:11px; margin-bottom:8px; }
#inspect .section { margin-top:10px; }
#inspect .section h3 { font-size:10px; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
#inspect .edge-item {
  padding:3px 8px; margin:2px 0; background:rgba(255,255,255,0.03);
  border-radius:6px; font-size:11px; cursor:pointer; transition:background 0.15s;
  border-left:3px solid transparent;
}
#inspect .edge-item:hover { background:rgba(255,255,255,0.08); }
#inspect .edge-item.coauthor { border-left-color:#5dade2; }
#inspect .edge-item.policy { border-left-color:#e74c3c; }
#inspect .edge-item.media { border-left-color:#2ecc71; }
#inspect .hint { color:var(--text-dim); font-size:12px; text-align:center; padding:24px 0; }

/* ── Timeline scrubber (v2.0) ──── */
#timeline-container {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  z-index:10; width:min(600px,90vw);
  background:var(--glass-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border); border-radius:16px; box-shadow:var(--shadow);
  padding:12px 20px 10px;
}
#timeline-container label { display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:4px; }
#timeline-slider { width:100%; accent-color:var(--accent); cursor:pointer; }
#timeline-year { font-weight:600; color:var(--accent); }

/* ── Responsive ────────────────── */
@media (max-width: 768px) {
  #sidebar { width:min(320px,85vw); left:8px; top:8px; max-height:calc(100vh - 16px); }
  #sidebar.collapsed { transform:translateX(-340px); }
  #toggle-sidebar { display:flex; }
  #timeline-container { width:calc(100vw - 16px); bottom:12px; padding:8px 14px 8px; }
  #inspect { font-size:12px; }
}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>Loading 5,401 nodes...</p></div>
<div id="graph-container"></div>

<div id="toggle-sidebar" onclick="toggleSidebar()">☰</div>
<div id="sidebar">
  <div id="search-section">
    <input id="search-input" placeholder="Search 5,401 entities..." autocomplete="off">
    <div id="search-results"></div>
  </div>
  <div id="controls">
    <button class="layer-btn active" data-layer="ALL">ALL</button>
    <button class="layer-btn" data-layer="CO_AUTHOR">Co-Author</button>
    <button class="layer-btn" data-layer="POLICY_ADVISORY">Policy</button>
    <button class="layer-btn" data-layer="MEDIA_NARRATIVE">Media</button>
  </div>
  <div id="stats"><span id="stat-nodes">0</span> nodes · <span id="stat-edges">0</span> edges</div>
  <div id="inspect"><div class="hint">Click a node or search above</div></div>
</div>

<div id="timeline-container">
  <label><span>Timeline Filter</span><span id="timeline-year">2020</span></label>
  <input type="range" id="timeline-slider" min="2019" max="2026" step="1" value="2026">
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
var graphData = null;
var Graph = null;  // ForceGraph instance
var fullIndex = [];
var nodeMap = {};  // id -> node
var currentLayers = { ALL: true, CO_AUTHOR: true, POLICY_ADVISORY: true, MEDIA_NARRATIVE: true };
var timelineYear = 2026;

// ── Load data ──────────────────────────────────────────────────────────
fetch('data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    graphData = data;
    fullIndex = data.fullIndex || [];
    (fullIndex || []).forEach(function(n) { nodeMap[n.id] = n; });
    document.getElementById('loading').classList.add('hidden');
    initGraph();
  })
  .catch(function(err) {
    // Fallback to legacy data.js
    if (typeof VIS_DATA !== 'undefined') {
      graphData = VIS_DATA;
      fullIndex = VIS_DATA.fullIndex || [];
      (fullIndex || []).forEach(function(n) { nodeMap[n.id] = n; });
      document.getElementById('loading').classList.add('hidden');
      initGraph();
    } else {
      document.querySelector('#loading p').textContent = 'Error loading data.';
    }
  });

// ── Init Graph ─────────────────────────────────────────────────────────
function initGraph() {
  var filterFn = getFilterFunction();
  var filtered = filterData(filterFn);

  Graph = ForceGraph()(document.getElementById('graph-container'))
    .graphData(filtered)
    .nodeId('id')
    .nodeLabel(function(n) { return n.id + (n.org ? '\n' + n.org : ''); })
    .nodeColor(function(n) { return n.color || '#95a5a6'; })
    .nodeVal(function(n) { return Math.max(2, Math.min(20, (n.centrality ? n.centrality.betweenness * 40 : 3) + 3)); })
    .linkColor(function(l) { return l.color || '#555'; })
    .linkWidth(1.2)
    .linkDirectionalParticles(0)
    .backgroundColor('#0f0f23')
    .d3AlphaDecay(0.02)
    .d3VelocityDecay(0.3)
    .cooldownTime(3000)
    .nodeCanvasObject(function(node, ctx, globalScale) {
      var label = node.label || node.id;
      var fontSize = Math.max(6, Math.min(12, 12 / globalScale * 8));
      ctx.font = fontSize + 'px Sans-Serif';
      var textWidth = ctx.measureText(label).width;
      var bckg = node.color || '#95a5a6';
      ctx.beginPath();
      ctx.arc(node.x, node.y, Math.max(2.5, 8 * globalScale), 0, 2 * Math.PI, false);
      ctx.fillStyle = bckg;
      ctx.fill();
      // Label
      if (globalScale > 0.6) {
        ctx.fillStyle = '#e0e0f0';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(label, node.x, node.y - Math.max(4, 8 * globalScale) - 2);
      }
    })
    .linkCanvasObject(function(link, ctx, globalScale) {
      var start = link.source;
      var end = link.target;
      if (!start || !end) return;
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(end.x, end.y);
      ctx.strokeStyle = link.color || '#555';
      ctx.lineWidth = Math.max(0.5, 1.2 * globalScale);
      ctx.stroke();
    })
    .onNodeClick(function(node) { showNodeInfo(node); })
    .onNodeHover(function(node) {
      document.body.style.cursor = node ? 'pointer' : 'default';
    });

  // Stats
  var fd = Graph.graphData();
  document.getElementById('stat-nodes').textContent = fd.nodes.length;
  document.getElementById('stat-edges').textContent = fd.links.length;
}

// ── Filter by year + layer ─────────────────────────────────────────────
function getFilterFunction() {
  return function(link) {
    // Year filter
    if (link.year && link.year > timelineYear) return false;
    // Layer filter
    if (currentLayers.ALL) return true;
    return currentLayers[link.layer] === true;
  };
}

function filterData(filterFn) {
  if (!graphData) return { nodes: [], links: [] };
  var allNodes = graphData.visible.nodes || [];
  var allEdges = graphData.visible.edges || [];
  var filteredEdges = allEdges.filter(filterFn);
  var nodeIds = new Set();
  filteredEdges.forEach(function(l) { nodeIds.add(l.source); nodeIds.add(l.target); });
  // Add nodes that are tier 1-3 always
  allNodes.forEach(function(n) {
    if (n.tier >= 1 && n.tier <= 3) nodeIds.add(allNodes.indexOf(n));
  });
  var filteredNodes = allNodes.filter(function(n, i) { return nodeIds.has(i); });
  // Remap indices
  var idxMap = {};
  var newNodes = [];
  filteredNodes.forEach(function(n, i) {
    idxMap[allNodes.indexOf(n)] = i;
    newNodes.push(n);
  });
  var newLinks = [];
  filteredEdges.forEach(function(l) {
    var si = idxMap[l.source];
    var ti = idxMap[l.target];
    if (si !== undefined && ti !== undefined) {
      newLinks.push({ source: si, target: ti, color: l.color, layer: l.layer, year: l.year, desc: l.desc });
    }
  });
  return { nodes: newNodes, links: newLinks };
}

function updateGraph() {
  if (!Graph) return;
  var filterFn = getFilterFunction();
  var filtered = filterData(filterFn);
  Graph.graphData(filtered);
  document.getElementById('stat-nodes').textContent = filtered.nodes.length;
  document.getElementById('stat-edges').textContent = filtered.links.length;
}

// ── Node Info ──────────────────────────────────────────────────────────
function showNodeInfo(node) {
  var fd = nodeLookup(node.id) || node;
  var html = '<h2>' + (node.id || '') + '</h2>';
  html += '<div class="meta">' + (node.org || '') + (node.tier ? ' · Tier ' + node.tier : '') + (node.role ? ' · ' + node.role : '') + '</div>';

  if (node.centrality) {
    html += '<div class="section"><h3>Centrality</h3><div style="display:flex;gap:12px;font-size:12px;">';
    html += '<span>Betweenness: <strong>' + node.centrality.betweenness + '</strong></span>';
    html += '<span>Degree: <strong>' + node.centrality.degree + '</strong></span></div></div>';
  }

  document.getElementById('inspect').innerHTML = html;
}

function nodeLookup(id) {
  return nodeMap[id] || null;
}

// ── Search ──────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', function() {
  var q = this.value.toLowerCase().trim();
  var el = document.getElementById('search-results');
  if (q.length < 1) { el.style.display = 'none'; return; }

  var scored = fullIndex.map(function(n) {
    var sc = 0;
    if (n.id.toLowerCase().indexOf(q) !== -1) sc += 10;
    if (n.org && n.org.toLowerCase().indexOf(q) !== -1) sc += 5;
    if (sc > 0) sc += (n.tier > 0 ? 3 : 0);
    return { node: n, score: sc };
  }).filter(function(x) { return x.score > 0; }).sort(function(a, b) { return b.score - a.score; }).slice(0, 20);

  if (scored.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = scored.map(function(s) {
    var n = s.node;
    return '<div class="sr-item" onclick="window.selectNode(\'' + n.id.replace(/'/g, "\\'") + '\')">' +
           '<strong>' + n.id + '</strong> ' + (n.org ? n.org : '') +
           ' <span class="sr-meta">T' + (n.tier || 0) + ' · β=' + (n.centrality || 0) + '</span></div>';
  }).join('');
});

window.selectNode = function(name) {
  document.getElementById('search-input').value = name;
  document.getElementById('search-results').style.display = 'none';

  if (!Graph) return;
  var fd = Graph.graphData();
  var found = null;
  fd.nodes.forEach(function(n) { if (n.id === name) found = n; });

  if (found) {
    Graph.centerAt(found.x, found.y, 600);
    Graph.zoom(2.5, 600);
    showNodeInfo(found);
  } else {
    // Show from index
    var lookup = nodeLookup(name);
    if (lookup) {
      document.getElementById('inspect').innerHTML =
        '<h2>' + lookup.id + '</h2><div class="meta">' + (lookup.org || '') + ' · Tier ' + lookup.tier + '</div>' +
        '<div class="section">Node exists in full index (5,401) but not in current visible set. Adjust filters or timeline.</div>';
    }
  }
};

// ── Layer Controls ─────────────────────────────────────────────────────
document.querySelectorAll('.layer-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var layer = this.dataset.layer;
    if (layer === 'ALL') {
      var allActive = !currentLayers.ALL;
      document.querySelectorAll('.layer-btn').forEach(function(b) { b.classList.toggle('active', allActive); });
      currentLayers = { ALL: allActive, CO_AUTHOR: allActive, POLICY_ADVISORY: allActive, MEDIA_NARRATIVE: allActive };
    } else {
      currentLayers[layer] = !currentLayers[layer];
      currentLayers.ALL = false;
      this.classList.toggle('active');
      document.querySelector('[data-layer="ALL"]').classList.remove('active');
    }
    updateGraph();
  });
});

// ── Timeline ───────────────────────────────────────────────────────────
document.getElementById('timeline-slider').addEventListener('input', function() {
  timelineYear = parseInt(this.value);
  document.getElementById('timeline-year').textContent = timelineYear;
  updateGraph();
});

// ── Sidebar toggle ─────────────────────────────────────────────────────
window.toggleSidebar = function() {
  document.getElementById('sidebar').classList.toggle('collapsed');
};

// ── Keyboard shortcut ──────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === '/' || (e.key === 's' && (e.metaKey || e.ctrlKey))) {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
});

// ── Handle resize ──────────────────────────────────────────────────────
window.addEventListener('resize', function() {
  // force-graph auto-resizes
});
</script>
</body>
</html>
