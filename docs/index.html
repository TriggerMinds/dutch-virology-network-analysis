<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dutch Virology Network -- Multiplex Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js" onerror="console.warn('unpkg fallback loaded')"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; overflow: hidden; }
#app { display: flex; width: 100%; height: 100vh; min-height: 100vh; }
#sidebar { width: 380px; min-width: 380px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; flex-shrink: 0; }
#sidebar-header { padding: 16px 20px; background: #0f3460; border-bottom: 2px solid #e94560; }
#sidebar-header h1 { font-size: 15px; color: #fff; line-height: 1.3; }
#sidebar-header h1 small { display: block; font-size: 11px; color: #8a8ab5; font-weight: 400; margin-top: 2px; }
#search-section { padding: 12px 16px; background: #1a1a3e; border-bottom: 1px solid #0f3460; }
#search-input { width: 100%; padding: 8px 12px; border: 1px solid #0f3460; border-radius: 4px; background: #0d1b3e; color: #e0e0e0; font-size: 13px; outline: none; }
#search-input:focus { border-color: #e94560; }
#search-results { max-height: 200px; overflow-y: auto; display: none; background: #0d1b3e; border: 1px solid #0f3460; border-top: none; border-radius: 0 0 4px 4px; position: relative; z-index: 100; }
.search-result-item { padding: 6px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #1a1a3e; }
.search-result-item:hover { background: #1a1a4e; }
.search-result-item .sr-tier { float: right; font-size: 10px; color: #8a8ab5; }
#controls { padding: 8px 16px; background: #1a1a3e; border-bottom: 1px solid #0f3460; display: flex; gap: 6px; flex-wrap: wrap; }
.layer-btn { padding: 4px 10px; border: 1px solid #0f3460; border-radius: 3px; background: transparent; color: #8a8ab5; font-size: 11px; cursor: pointer; transition: all 0.2s; }
.layer-btn:hover { border-color: #e94560; }
.layer-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
#stats { padding: 6px 16px; font-size: 11px; color: #6a6a95; border-bottom: 1px solid #0f3460; display: flex; gap: 12px; flex-wrap: wrap; }
#inspect-panel { flex: 1; padding: 12px 16px; overflow-y: auto; font-size: 13px; min-height: 0; }
#inspect-panel h2 { font-size: 18px; color: #e94560; margin-bottom: 4px; }
#inspect-panel .meta { color: #8a8ab5; font-size: 12px; margin-bottom: 8px; }
#inspect-panel .section { margin-top: 10px; }
#inspect-panel .section h3 { font-size: 12px; color: #e94560; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
#inspect-panel .edge-item { padding: 3px 6px; margin: 2px 0; background: #0d1b3e; border-radius: 3px; font-size: 12px; cursor: pointer; border-left: 3px solid transparent; }
#inspect-panel .edge-item:hover { background: #1a2a5e; }
#inspect-panel .edge-item.policy { border-left-color: #e74c3c; }
#inspect-panel .edge-item.coauthor { border-left-color: #5dade2; }
#inspect-panel .edge-item.media { border-left-color: #2ecc71; }
#inspect-panel .evidence-item { padding: 4px 6px; margin: 3px 0; background: #0d1b3e; border-left: 3px solid #e94560; font-size: 11px; font-style: italic; color: #b0b0d0; }
#inspect-panel .hint { color: #6a6a95; font-size: 12px; text-align: center; padding: 40px 0; }
#inspect-panel .layer-note { background: #0f3460; padding: 6px 8px; border-radius: 3px; font-size: 11px; color: #f39c12; margin: 6px 0; }
#graph-container { flex: 1; height: 100vh; min-height: 100vh; position: relative; background: #1a1a2e; }
#graph-container div.vis-network { width: 100% !important; height: 100% !important; }
#graph-container canvas { display: block; width: 100% !important; height: 100% !important; }
#legend { position: absolute; bottom: 20px; left: 20px; background: rgba(22, 33, 62, 0.9); padding: 8px 12px; border-radius: 4px; border: 1px solid #0f3460; font-size: 11px; color: #8a8ab5; z-index: 10; }
.legend-item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#sidebar-footer { padding: 8px 16px; font-size: 10px; color: #4a4a75; border-top: 1px solid #0f3460; text-align: center; flex-shrink: 0; }
#sidebar-footer a { color: #8a8ab5; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Dutch Virology Network <small>Multiplex Knowledge Graph</small></h1>
    </div>
    <div id="search-section">
      <input type="text" id="search-input" placeholder="Search 5,401 nodes..." autocomplete="off">
      <div id="search-results"></div>
    </div>
    <div id="controls">
      <button class="layer-btn active" data-layer="ALL">ALL</button>
      <button class="layer-btn" data-layer="CO_AUTHOR">Co-Author</button>
      <button class="layer-btn" data-layer="POLICY_ADVISORY">Policy</button>
      <button class="layer-btn" data-layer="MEDIA_NARRATIVE">Media</button>
    </div>
    <div id="stats">
      <span id="stat-nodes">0 nodes</span>
      <span id="stat-edges">0 edges</span>
      <span id="stat-search">5,401 searchable</span>
    </div>
    <div id="inspect-panel"><div class="hint">Click a node or search above</div></div>
    <div id="sidebar-footer">
      <a href="https://github.com/TriggerMinds/dutch-virology-network-analysis" target="_blank">GitHub</a>
    </div>
  </div>
  <div id="graph-container">
    <div id="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#e74c3c"></span> Tier 1 Core</div>
      <div class="legend-item"><span class="legend-dot" style="background:#3498db"></span> Tier 2 Bridge</div>
      <div class="legend-item"><span class="legend-dot" style="background:#2ecc71"></span> Tier 3 Media</div>
      <div class="legend-item"><span class="legend-dot" style="background:#f39c12"></span> Key Event</div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function() {
  'use strict';

  const container = document.getElementById('graph-container');
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  const inspectPanel = document.getElementById('inspect-panel');
  const statNodes = document.getElementById('stat-nodes');
  const statEdges = document.getElementById('stat-edges');
  const statSearch = document.getElementById('stat-search');

  statSearch.textContent = (VIS_DATA.fullIndex || []).length + ' searchable';

  // ── Full data indices ─────────────────────────────────────────────────
  var allNodes = VIS_DATA.fullIndex || [];
  var nodeLookup = {};
  allNodes.forEach(function(n) { nodeLookup[n.id] = n; });
  var timeline = VIS_DATA.timeline || [];
  var fullNodeList = VIS_DATA.nodes || [];
  var fullEdgeList = VIS_DATA.edges || [];

  // Build edge index by name for fast lookup: name -> [{target, layer, ...}]
  var edgeIndex = {};
  function buildEdgeIndex() {
    edgeIndex = {};
    fullEdgeList.forEach(function(e, ei) {
      var src = fullNodeList[e.from];
      var tgt = fullNodeList[e.to];
      if (!src || !tgt || !src.full_data || !tgt.full_data) return;
      var sname = src.full_data.id;
      var tname = tgt.full_data.id;
      if (!edgeIndex[sname]) edgeIndex[sname] = [];
      edgeIndex[sname].push({ target: tname, layer: e.layer, color: e.color, dashes: e.dashes, title: e.title, edgeIdx: ei });
      if (!edgeIndex[tname]) edgeIndex[tname] = [];
      edgeIndex[tname].push({ target: sname, layer: e.layer, color: e.color, dashes: e.dashes, title: e.title, edgeIdx: ei });
    });
  }
  buildEdgeIndex();

  // ── State ─────────────────────────────────────────────────────────────
  var network = null;
  var activeNodes = [];
  var activeEdges = [];
  var nodeIdMap = {};  // fullData.id -> activeNodes index
  var currentLayers = { ALL: true, CO_AUTHOR: true, POLICY_ADVISORY: true, MEDIA_NARRATIVE: true };

  // ── Helper: ensure a node + its 1st-degree neighbors are active ───────
  function ensureNode(fullId) {
    if (nodeIdMap[fullId] !== undefined) return nodeIdMap[fullId];
    // Find in fullNodeList
    var srcIdx = -1;
    for (var i = 0; i < fullNodeList.length; i++) {
      if (fullNodeList[i].full_data && fullNodeList[i].full_data.id === fullId) {
        srcIdx = i; break;
      }
    }
    if (srcIdx < 0) return -1;
    var srcNode = fullNodeList[srcIdx];
    var newIdx = activeNodes.length;
    activeNodes.push({
      id: newIdx, label: srcNode.label, title: srcNode.title,
      group: srcNode.group, value: srcNode.value || 15,
      color: srcNode.color, physics: true,
      full_data: srcNode.full_data
    });
    nodeIdMap[fullId] = newIdx;
    // Find edges from/all to this node from fullEdgeList
    for (var j = 0; j < fullEdgeList.length; j++) {
      var e = fullEdgeList[j];
      var s = fullNodeList[e.from], t = fullNodeList[e.to];
      if (!s || !t || !s.full_data || !t.full_data) continue;
      var otherId = null;
      if (s.full_data.id === fullId) otherId = t.full_data.id;
      else if (t.full_data.id === fullId) otherId = s.full_data.id;
      if (!otherId) continue;
      // Ensure the other node exists
      var otherIdx = -1;
      if (nodeIdMap[otherId] !== undefined) {
        otherIdx = nodeIdMap[otherId];
      } else {
        // Try to find in fullNodeList
        for (var k = 0; k < fullNodeList.length; k++) {
          if (fullNodeList[k].full_data && fullNodeList[k].full_data.id === otherId) {
            otherIdx = ensureNode(otherId); break;
          }
        }
      }
      if (otherIdx >= 0) {
        var already = activeEdges.some(function(ae) {
          return (ae.from === newIdx && ae.to === otherIdx) || (ae.from === otherIdx && ae.to === newIdx);
        });
        if (!already) {
          activeEdges.push({
            from: newIdx, to: otherIdx,
            color: e.color, dashes: e.dashes, title: e.title, layer: e.layer
          });
        }
      }
    }
    return newIdx;
  }

  // ── Build initial graph: ALL nodes from fullNodeList ──────────────────
  function buildInitialGraph() {
    activeNodes = [];
    activeEdges = [];
    nodeIdMap = {};

    fullNodeList.forEach(function(node) {
      if (!node.full_data) return;
      var nid = activeNodes.length;
      activeNodes.push({
        id: nid, label: node.label, title: node.title,
        group: node.group, value: node.value || 15,
        color: node.color, physics: true,
        full_data: node.full_data
      });
      nodeIdMap[node.full_data.id] = nid;
    });

    // Add all edges (will be filtered by rebuildNetwork)
    fullEdgeList.forEach(function(e) {
      var src = fullNodeList[e.from];
      var tgt = fullNodeList[e.to];
      if (!src || !tgt || !src.full_data || !tgt.full_data) return;
      var si = nodeIdMap[src.full_data.id];
      var ti = nodeIdMap[tgt.full_data.id];
      if (si === undefined || ti === undefined) return;
      // Avoid exact duplicates
      var dup = activeEdges.some(function(ae) { return (ae.from === si && ae.to === ti) || (ae.from === ti && ae.to === si); });
      if (!dup) {
        activeEdges.push({
          from: si, to: ti,
          color: e.color, dashes: e.dashes, title: e.title, layer: e.layer
        });
      }
    });
  }

  // ── Render with layer filter ──────────────────────────────────────────
  function renderGraph() {
    var filteredEdges = activeEdges.filter(function(e) {
      if (currentLayers.ALL) return true;
      if (e.layer === 'CO_AUTHOR' && !currentLayers.CO_AUTHOR) return false;
      if (e.layer === 'POLICY_ADVISORY' && !currentLayers.POLICY_ADVISORY) return false;
      if (e.layer === 'MEDIA_NARRATIVE' && !currentLayers.MEDIA_NARRATIVE) return false;
      return true;
    });

    if (network) network.destroy();
    var nodes = new vis.DataSet(activeNodes);
    var edges = new vis.DataSet(filteredEdges);

    statNodes.textContent = activeNodes.length + ' nodes';
    statEdges.textContent = filteredEdges.length + ' edges';

    var options = {
      physics: { stabilization: { iterations: 80 }, solver: 'forceAtlas2Based',
                 forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.005, springLength: 120, springConstant: 0.02 } },
      interaction: { hover: true, tooltipDelay: 200, zoomView: true, dragView: true },
      edges: { smooth: { type: 'continuous' }, width: 1.5 },
      nodes: { shape: 'dot', borderWidth: 1, font: { size: 10, color: '#c0c0e0' }, scaling: { min: 8, max: 30 } },
      layout: { improvedLayout: false }
    };
    network = new vis.Network(container, { nodes: nodes, edges: edges }, options);
    network.on('click', function(params) { if (params.nodes.length > 0) showNodeInfo(params.nodes[0]); else showDefaultInfo(); });
    network.on('hoverNode', function() { document.body.style.cursor = 'pointer'; });
    network.on('blurNode', function() { document.body.style.cursor = 'default'; });
  }

  // ── Show info ─────────────────────────────────────────────────────────
  function showNodeInfo(idx) {
    var node = activeNodes.filter(function(n) { return n.id === idx; })[0];
    if (!node) return;
    var d = node.full_data;
    var html = '<h2>' + d.id + '</h2>';
    html += '<div class="meta">';
    if (d.org) html += d.org + ' . ';
    html += 'Tier ' + d.tier + ' . ' + (d.role || '') + '</div>';

    var betw = d.betweenness !== undefined ? d.betweenness : (nodeLookup[d.id] ? nodeLookup[d.id].betweenness : 0);
    html += '<div class="section"><h3>Centrality</h3><div style="display:flex;gap:12px;font-size:12px;">';
    html += '<span>Betweenness: <strong>' + betw + '</strong></span>';
    html += '<span>Degree (visible): <strong>' + d.degree + '</strong></span></div></div>';

    // Find edges from full data
    var nodeEdges = edgeIndex[d.id] || [];
    // Filter by current layer
    var filteredNodeEdges = nodeEdges.filter(function(e) {
      if (currentLayers.ALL) return true;
      if (e.layer === 'CO_AUTHOR' && !currentLayers.CO_AUTHOR) return false;
      if (e.layer === 'POLICY_ADVISORY' && !currentLayers.POLICY_ADVISORY) return false;
      if (e.layer === 'MEDIA_NARRATIVE' && !currentLayers.MEDIA_NARRATIVE) return false;
      return true;
    });

    // Layer context note
    if (filteredNodeEdges.length === 0 && nodeEdges.length > 0) {
      var layerList = [];
      var tmp = {};
      nodeEdges.forEach(function(e) { tmp[e.layer] = (tmp[e.layer] || 0) + 1; });
      for (var l in tmp) layerList.push(tmp[l] + ' ' + l);
      html += '<div class="layer-note">Gevonden in: ' + layerList.join(', ') + '. Wijzig filter om te zien.</div>';
    }

    if (filteredNodeEdges.length > 0) {
      html += '<div class="section"><h3>Connections (' + filteredNodeEdges.length + ')</h3>';
      var byLayer = {};
      filteredNodeEdges.forEach(function(e) {
        if (!byLayer[e.layer]) byLayer[e.layer] = [];
        byLayer[e.layer].push(e);
      });
      for (var layer in byLayer) {
        var cssClass = { CO_AUTHOR: 'coauthor', POLICY_ADVISORY: 'policy', MEDIA_NARRATIVE: 'media', CONSORTIUM_FUNDING: 'coauthor' }[layer] || '';
        html += '<div style="margin-top:4px;font-size:11px;color:#e94560;">' + layer + ' (' + byLayer[layer].length + ')</div>';
        byLayer[layer].slice(0, 12).forEach(function(e) {
          html += '<div class="edge-item ' + cssClass + '" onclick="window.focusNode && window.focusNode(\'' + e.target.replace(/'/g, "\\'") + '\')">' + e.target + ' <span style="color:#6a6a95;font-size:10px;">' + (e.title || '').substr(0,50) + '</span></div>';
        });
        if (byLayer[layer].length > 12) html += '<div style="color:#6a6a95;font-size:11px;">... and ' + (byLayer[layer].length - 12) + ' more</div>';
      }
      html += '</div>';
    }

    if (d.evidence && d.evidence.length > 0) {
      html += '<div class="section"><h3>Evidence Quotes</h3>';
      d.evidence.slice(0, 3).forEach(function(eq) {
        html += '<div class="evidence-item">"' + eq.quote + '" <span style="color:#6a6a95;font-size:10px;">-- ' + eq.source + ' p' + eq.page + '</span></div>';
      });
      html += '</div>';
    }
    inspectPanel.innerHTML = html;
  }

  function showDefaultInfo() {
    var html = '<div class="hint">Click a node or search above</div>';
    if (timeline && timeline.length > 0) {
      html += '<div class="section" style="margin-top:12px;"><h3>Timeline</h3>';
      timeline.slice(0, 6).forEach(function(t) {
        html += '<div style="padding:3px 6px;margin:2px 0;background:#0d1b3e;border-radius:3px;font-size:11px;">';
        html += '<span style="color:#e94560;">' + t.date + '</span> ' + (t.type || '') + ': ' + (t.desc || '');
        html += '</div>';
      });
      html += '</div>';
    }
    inspectPanel.innerHTML = html;
  }

  window.focusNode = function(name) {
    if (typeof name !== 'string') return; // numeric index received -> lookup
    var idx = nodeIdMap[name];
    if (idx !== undefined && network) {
      network.focus(idx, { scale: 2.0, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
      network.selectNodes([idx]);
      showNodeInfo(idx);
    }
  };

  // ── Search ────────────────────────────────────────────────────────────
  searchInput.addEventListener('input', function() {
    var q = this.value.toLowerCase().trim();
    if (q.length < 1) { searchResults.style.display = 'none'; return; }
    var scored = allNodes.map(function(n) {
      var score = 0;
      if (n.id.toLowerCase().indexOf(q) !== -1) score += 10;
      if (n.label && n.label.toLowerCase().indexOf(q) !== -1) score += 8;
      if (n.org && n.org.toLowerCase().indexOf(q) !== -1) score += 5;
      if (score > 0) score += (n.tier > 0 ? 5 : 0);
      return { node: n, score: score };
    }).filter(function(x) { return x.score > 0; }).sort(function(a, b) { return b.score - a.score; }).slice(0, 20);

    if (scored.length === 0) { searchResults.style.display = 'none'; return; }
    searchResults.style.display = 'block';
    searchResults.innerHTML = scored.map(function(s) {
      var n = s.node;
      return '<div class="search-result-item" onclick="window.selectSearch(\'' + n.id.replace(/'/g, "\\'") + '\')">' +
             '<strong>' + n.id + '</strong> ' + (n.org || '') +
             ' <span class="sr-tier">T' + (n.tier || 0) + ' . beta=' + (n.betweenness || 0) + '</span></div>';
    }).join('');
  });

  window.selectSearch = function(name) {
    searchInput.value = name;
    searchResults.style.display = 'none';

    // Inject the node + all neighbors from complete data
    ensureNode(name);

    // Auto-switch to ALL if current filter hides all edges for this node
    var nodeEdges = edgeIndex[name] || [];
    var visibleUnderCurrent = nodeEdges.filter(function(e) {
      if (currentLayers.ALL) return true;
      var l = e.layer;
      return currentLayers[l] === true;
    });

    if (visibleUnderCurrent.length === 0 && nodeEdges.length > 0) {
      // Switch to ALL
      document.querySelectorAll('.layer-btn').forEach(function(b) { b.classList.add('active'); });
      currentLayers = { ALL: true, CO_AUTHOR: true, POLICY_ADVISORY: true, MEDIA_NARRATIVE: true };
    }

    renderGraph();

    var newIdx = nodeIdMap[name];
    if (newIdx !== undefined) {
      setTimeout(function() {
        if (network) {
          network.focus(newIdx, { scale: 2.2, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
          network.selectNodes([newIdx]);
          showNodeInfo(newIdx);
        }
      }, 150);
    } else {
      var lookup = nodeLookup[name];
      if (lookup) {
        inspectPanel.innerHTML = '<h2>' + name + '</h2><div class="meta">' +
          (lookup.org || '') + ' . Tier ' + lookup.tier + ' . ' + (lookup.role || '') +
          '</div><div class="section"><h3>Stats</h3>Betweenness: ' + (lookup.betweenness || 'N/A') + '</div>';
      }
    }
  };

  // ── Layer Controls ────────────────────────────────────────────────────
  document.querySelectorAll('.layer-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var layer = this.dataset.layer;

      if (layer === 'ALL') {
        // Toggle all on/off
        var allActive = !currentLayers.ALL;
        document.querySelectorAll('.layer-btn').forEach(function(b) { b.classList.toggle('active', allActive); });
        currentLayers = { ALL: allActive, CO_AUTHOR: allActive, POLICY_ADVISORY: allActive, MEDIA_NARRATIVE: allActive };
      } else {
        // Toggle single layer
        currentLayers[layer] = !currentLayers[layer];
        this.classList.toggle('active');
        // Update ALL button: active if all 3 layers active
        var allActive = currentLayers.CO_AUTHOR && currentLayers.POLICY_ADVISORY && currentLayers.MEDIA_NARRATIVE;
        currentLayers.ALL = allActive;
        document.querySelector('[data-layer="ALL"]').classList.toggle('active', allActive);
      }
      renderGraph();
    });
  });

  // ── Init ──────────────────────────────────────────────────────────────
  buildInitialGraph();
  renderGraph();
  showDefaultInfo();

})();
</script>
</body>
</html>
